name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test build + unit tests
    runs-on: ubuntu-latest
    steps:
      # No submodules: the LVGL submodule is only needed by the hardware build,
      # and cloning it here would dominate the run time.
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libcmocka-dev

      # Presets, so CI and a developer's machine invoke the build the same way
      # and cannot drift apart. The host preset builds into build/host.
      - name: Configure
        run: cmake --preset host

      - name: Build
        run: cmake --build --preset host

      - name: Run tests
        run: ctest --preset host
